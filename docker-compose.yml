services:
  approval-center-mcp:
    build: .
    image: approval-center-mcp:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LISTEN_ADDR: :8080
      DB_PATH: /data/approval.db
      POLICY_FILE: /etc/approval-center/policies.yaml
    volumes:
      - approval-data:/data
      - ./config/policies.yaml:/etc/approval-center/policies.yaml:ro
    expose:
      - "8080"
    mem_limit: 256m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - goclaw-internal

volumes:
  approval-data:

networks:
  goclaw-internal:
    external: true
    name: ${GOCLAW_DOCKER_NETWORK:-goclaw-net}
